<html lang="pt-BR">

<body>

</body>
<section id="contato">
    <div class="conteudo">
        <h2>Fale comigo</h2>
        <form action="#" method="get">
            <div class="cards">
                <article class="campo">
                    <label for="nome">Seu nome</label>
                    <input type="text" id="nome" nome="nome" placeholder="Ana Souza" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" nome="email" placeholder="voce@exemplo.com" required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" nome="telefone" placeholder="(21) 99999-9999" required>
            </div>
            <div class="campo">
                <label for="assunto">Assunto</label>
                <select id="assunto" nome="assunto">
                    <option value="encomenda">Fazer uma encomenda</options>
                    <option value="orcamento">Pedir um orçamento</option>
                    <option value="duvida">Tirar uma dúvida</option>
                </select>
            </div>

            <fieldset class="campo">
                <legend>Como prefere que eu responda?</legend>
                <label class="opcao"><input type="radio" nome="resposta" value="whatsapp" checked>Whatsapp</label>
                <label class="opcao"><input type="radio" nome="resposta" value="email"> E-mail</label>
            </fieldset>

            <div class="campo">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" nome="mensagem" rows="5"
                    placeholder="Conte o que você precisa e para quando."></textarea>
            </div>

            <button type="submit" class="botao">Enviar mensagem</button>
        </form>
    </div>
</section>
</main>
<footer>
    <p>© 2026 Doces da Maria. Página de exemplo feita em aula.</p>
</footer>

</body>

</html>
